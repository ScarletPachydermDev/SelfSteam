app-id: io.github.ScarletPachydermDev.SelfSteam
runtime: org.gnome.Platform
# Current stable branch confirmed live via Flathub's own API
# (flathub.org/api/v2/summary/org.gnome.Platform -> "branch": "50"),
# not guessed -- matches gridge-desktop's own manifest, which pins the
# same branch.
runtime-version: '50'
sdk: org.gnome.Sdk
command: selfsteam-launcher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --device=dri
  # flatpak-spawn --host escape hatch (see host_exec.py's own docstring)
  # -- required for: systemctl/loginctl (installing/enabling the
  # persistent background service), and everything else this app shells
  # out to on the host (flatpak install/override for emulators, Steam
  # restart, gamescope window foregrounding, etc).
  - --talk-name=org.freedesktop.Flatpak
  # Real, broad host filesystem access, read-write -- wider than
  # gridge-desktop's own narrower --filesystem grants (~/.steam,
  # xdg-data/Steam, ~/.var/app), because this app's actual job is
  # wider: browsing/reading a user's own ROM library from anywhere on
  # disk (see selfsteam_server.py's own _RA_ROOT = "/" comment on why
  # that picker is deliberately rooted at the real filesystem root, not
  # just home), and writing shortcuts.vdf and grid artwork into Steam's
  # own directory (native or Flatpak).
  - --filesystem=host
  # --filesystem=host does NOT cover this, despite an earlier version of
  # this comment claiming it did -- confirmed live (2026-08-21) that
  # Flatpak specifically excludes *other* apps' ~/.var/app/<id>/
  # directories from a broad host/home grant; only the calling app's own
  # ~/.var/app/<own-id>/ is ever visible without this. Every
  # standalone_emulators.py install helper (BIOS/keys/firmware) writes
  # into some *other* Flatpak-installed emulator's own ~/.var/app/<id>/
  # config -- without this, those writes silently no-op (create+write
  # succeeds against a phantom/unmounted path, nothing persists), which
  # is exactly what made xemu's 3 BIOS files look "picked but ignored."
  - --filesystem=~/.var/app

modules:
  - name: python3-cryptography
    # Needed by nsp_metadata.py (Switch DLC/update NSP title-ID
    # parsing -- AES-128-XTS over an NCA header). Prebuilt manylinux
    # wheels, not built from source: `cryptography` has required a
    # real Rust toolchain (its OpenSSL bindings are Rust, not C) since
    # 3.4, which would mean vendoring a Rust SDK extension plus a full
    # `cargo vendor` dependency tree just for this one narrow use --
    # a maintenance burden completely out of proportion to what this
    # app actually needs from the package. Pinned wheel URLs + sha256
    # (fetched up front by flatpak-builder like any other source, then
    # installed with pip3 --no-index so no network touches the actual
    # build sandbox) is the same pattern most Flathub Python apps that
    # need `cryptography` already use for this exact reason.
    #
    # x86_64 only, matching this manifest's only real build target
    # (see .github/workflows/flatpak.yml's selfsteam-x86_64.flatpak) --
    # cryptography's own wheel is cp39-abi3 (works unchanged on
    # org.gnome.Platform//50's Python 3.13), cffi's is not (a real
    # per-version C extension), pinned here to cp313 to match.
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app
          cffi-2.1.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
          pycparser-3.0-py3-none-any.whl
          cryptography-50.0.1-cp39-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/95/95/86342356ff5953b3fb06f7ef7c5bee212d45e770abc7218d451b9148313c/cffi-2.1.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: a931079504ecc49efed7744c476a5c343a92fabf66dec2db95edb1b2fdc770e2
      - type: file
        url: https://files.pythonhosted.org/packages/0c/c3/44f3fbbfa403ea2a7c779186dc20772604442dde72947e7d01069cbe98e3/pycparser-3.0-py3-none-any.whl
        sha256: b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
      - type: file
        url: https://files.pythonhosted.org/packages/7e/3c/0e77bd5ffcf078e9dd27d3074aad6c030d9b10d0bf69329d573c927a188c/cryptography-50.0.1-cp39-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: e22dfed744bd4002e909464cb23d2f0b05c6f3113a79ef2e9864a53db737c733

  - name: selfsteam
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/selfsteam
      - cp -r *.py vendor launch-browser.sh /app/share/selfsteam/
      - install -Dm755 packaging/selfsteam.sh /app/bin/selfsteam-launcher
      - install -Dm644 packaging/io.github.ScarletPachydermDev.SelfSteam.desktop
          /app/share/applications/io.github.ScarletPachydermDev.SelfSteam.desktop
      - install -Dm644 packaging/io.github.ScarletPachydermDev.SelfSteam.metainfo.xml
          /app/share/metainfo/io.github.ScarletPachydermDev.SelfSteam.metainfo.xml
      # Pre-rasterized PNGs, not the source SVG -- confirmed live that
      # org.gnome.Sdk//50's appstreamcli-compose can't rasterize SVG
      # itself during the build ("Unrecognised image file format" /
      # file-read-error, reproduced directly against appstreamcli, not
      # a manifest/build-script bug), so a raw SVG in hicolor/scalable
      # fails the whole compose step. Shipping pre-rendered 64/128px
      # PNGs (packaging/hicolor/<size>/apps/, generated from the same
      # source SVG via cairosvg) sidesteps that entirely -- also the
      # standard, common workaround for exactly this SDK limitation.
      - install -Dm644 packaging/hicolor/64x64/apps/io.github.ScarletPachydermDev.SelfSteam.png
          /app/share/icons/hicolor/64x64/apps/io.github.ScarletPachydermDev.SelfSteam.png
      - install -Dm644 packaging/hicolor/128x128/apps/io.github.ScarletPachydermDev.SelfSteam.png
          /app/share/icons/hicolor/128x128/apps/io.github.ScarletPachydermDev.SelfSteam.png
    sources:
      # Real git source, matching gridge-desktop's own manifest --
      # reproducible from the public repo + ref, not a local checkout
      # path. GitHub Actions' own checkout puts the full repo right
      # next to this manifest anyway, but a manifest that only works
      # from inside a specific CI checkout layout isn't actually
      # reproducible for anyone building it standalone later.
      - type: git
        url: https://github.com/ScarletPachydermDev/SelfSteam.git
        branch: master
